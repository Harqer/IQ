apiVersion: v1
kind: Pod
metadata:
  name: iq-mamba3-attention-reader
spec:
  restartPolicy: Always
  containers:
  - name: reader
    image: python:3.11-slim
    command:
    - sh
    - -c
    args:
    - while true; do sleep 3600; done
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    volumeMounts:
    - name: artifacts
      mountPath: /artifacts
      readOnly: true
  volumes:
  - name: artifacts
    persistentVolumeClaim:
      claimName: iq-mamba3-attention-artifacts

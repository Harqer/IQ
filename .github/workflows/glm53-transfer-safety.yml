name: GLM53 Full78 Transfer Safety

on:
  pull_request:
    paths:
      - "iq_transfer/glm53_*.py"
      - "iq_transfer/complete_transplant.py"
      - "scripts/*glm53*.py"
      - "scripts/*glm53*.sh"
      - "tests/test_glm53_*.py"
      - "docs/glm53-full78-gpu-runbook.md"
      - "docs/glm53-gpu-stack-audit.md"
      - "requirements-transfer.txt"
      - "requirements-model.txt"
      - ".github/workflows/glm53-transfer-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only validation dependencies (no HF compute jobs)
        run: |
          python -m pip install -r requirements-transfer.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Strict code/shell syntax
        run: |
          python -m compileall -q iq_transfer scripts/glm53_full78_gate.py scripts/glm53_calibration_sha256.py scripts/start_glm53_full78_local.py scripts/recover_glm53_mamba018.py scripts/audit_glm53_hf_shards.py scripts/finalize_glm53_full78_metadata.py scripts/verify_glm53_full78_remote_local.py scripts/assemble_glm53_full78_calibration_local.py
          bash -n scripts/setup_glm53_gpu_worker.sh
          bash -n scripts/repair_glm53_full78_calibration.sh
          bash -n scripts/start_glm53_full78_gpu_from_verified_calibration.sh
          bash -n scripts/resume_glm53_full78_mounted_cloud.sh
      - name: Audit CPU dependency stack (CUDA required only on GPU workers)
        run: |
          python scripts/check_glm53_gpu_stack.py --pip-check
      - name: No-cloud-cost failure injection and lineage tests
        run: |
          python -m unittest discover -s tests -p 'test_glm53_bucket_persistence.py' -v
          python -m unittest discover -s tests -p 'test_glm53_mamba018_recovery.py' -v
          python -m unittest discover -s tests -p 'test_glm53_metadata_finalizer.py' -v
          python -m unittest discover -s tests -p 'test_glm53_gpu_stack.py' -v
          python -m unittest discover -s tests -p 'test_glm53_full78_gate.py' -v
          python -m unittest discover -s tests -p 'test_glm53_atomic_shards.py' -v
          python -m unittest discover -s tests -p 'test_glm53_provenance.py' -v
          python -m unittest discover -s tests -p 'test_glm53_resume.py' -v
          python -m unittest discover -s tests -p 'test_glm53_gpu_projection.py' -v
          python -m unittest discover -s tests -p 'test_glm53_gpu_batch.py' -v
          python -m unittest discover -s tests -p 'test_glm53_batch_prefetch.py' -v
          python -m unittest discover -s tests -p 'test_glm53_partial_recovery.py' -v
          python -m unittest discover -s tests -p 'test_glm53_partial_stage_writer.py' -v
          python -m unittest discover -s tests -p 'test_glm53_storage_policy.py' -v
          python -m unittest discover -s tests -p 'test_glm53_full78_architecture.py' -v


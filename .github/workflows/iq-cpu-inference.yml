name: IQ CPU inference regression

on:
  push:
    branches:
      - sync/iq235-full-inference-20261122
    paths:
      - iq_model/state/mamba3_cpu.py
      - iq_local/**
      - scripts/serve_iq_local.py
      - scripts/verify_iq_full_inference.py
      - tests/iq_local/**
      - .github/workflows/iq-cpu-inference.yml
      - requirements-local.txt
  pull_request:
    paths:
      - iq_model/state/mamba3_cpu.py
      - iq_local/**
      - scripts/serve_iq_local.py
      - scripts/verify_iq_full_inference.py
      - tests/iq_local/**
      - .github/workflows/iq-cpu-inference.yml
      - requirements-local.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-mamba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10,<3"
          python -m pip install -r requirements-local.txt
          python -m pip install ruff
      - name: Compile Python source
        run: python -m compileall -q iq_model/state/mamba3_cpu.py iq_local scripts/serve_iq_local.py scripts/verify_iq_full_inference.py tests/iq_local
      - name: Lint changed CPU runtime and regression test
        run: python -m ruff check --select E4,E7,E9,F iq_model/state/mamba3_cpu.py tests/iq_local/test_mamba_mixed_dtype.py
      - name: Run Mamba CPU prefill and decode regression tests
        run: python -m pytest -q tests/iq_local/test_mamba_mixed_dtype.py tests/iq_local/test_mamba_cpu.py tests/iq_local/test_cache.py tests/iq_local/test_runner.py tests/iq_local/test_server.py

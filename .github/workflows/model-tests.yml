name: model-tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: model-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install model test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model.txt

      - name: Compile Python packages
        run: |
          python -m compileall -q iq_model iq_training iq_transfer iq_harness

      - name: Run unit suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"
  
  official-glm-attention:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install official publisher operator dependencies
        run: |
          python -m pip install -r requirements-model.txt
          python -m pip install "transformers==5.15.0"

      - name: Verify source-native GLM MLA/DSA + IndexShare on CPU
        env:
          IQ_REQUIRE_HF_GLM_ATTENTION: "1"
        run: |
          python -m unittest discover -s tests -p "test_glm53_official_attention.py" -v

  mcore-builder-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install official NVIDIA Megatron Core
        run: |
          python -m pip install -r requirements-model.txt
          python -m pip install "megatron-core==0.19.0"

      - name: Validate actual NVIDIA MCore Builder and Pipeline Layout APIs
        run: |
          python -m unittest discover -s tests -p "test_iq_mcore_builder.py" -v
          python -m unittest discover -s tests -p "test_iq_bridge_model_contract.py" -v

  native-bridge-weight-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install documented NVIDIA Bridge and MCore releases
        run: |
          python -m pip install -r requirements-model.txt
          python -m pip install "megatron-core==0.19.0"
          # NVIDIA's full 0.6.2 dependency chain includes CUDA-compiled
          # flash/fast-hadamard modules, which cannot build on a CPU runner.
          # Only import and test NVIDIA's *real* released Python registry
          # here; do not claim this qualifies full GPU Bridge conversion.
          python -m pip install --no-deps "megatron-bridge==0.6.2"
          python -m pip install "transformers==5.12.1" einops omegaconf hydra-core

      - name: Validate actual NVIDIA DirectMapping registry and native tensor round trips
        run: |
          python - <<'PY'
          from importlib.metadata import version
          assert version("megatron-core") == "0.19.0"
          assert version("megatron-bridge") == "0.6.2"
          PY
          IQ_REQUIRE_NVIDIA_BRIDGE=1 python -m unittest discover -s tests -p "test_iq_native_weight_registry.py" -v

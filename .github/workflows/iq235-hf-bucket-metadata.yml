name: iq235-hf-bucket-metadata

on:
  pull_request:
    paths:
      - "iq_cloud/checkpoint_metadata.py"
      - "iq_cloud/glm53_lexical.py"
      - "configs/iq235_checkpoint_source.json"
      - "configs/iq235_glm53_tokenizer_phase_a.json"
      - "scripts/iq235_bucket_metadata.py"
      - ".github/workflows/iq235-hf-bucket-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bucket-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HF metadata client only
        run: python -m pip install "huggingface_hub==1.33.0"
      - name: Audit read-only IQ235 index and completion marker
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -m scripts.iq235_bucket_metadata

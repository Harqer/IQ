name: IQ Baseten OTel preflight (CPU only)
on:
  push:
    branches:
      - "telemetry/**"
    paths:
      - "scripts/iq_telemetry.py"
      - "scripts/baseten_iq_preflight.py"
      - "scripts/requirements_iq_telemetry.txt"
      - "tests/test_baseten_iq_telemetry.py"
      - ".github/workflows/iq-baseten-otel-preflight.yml"
  pull_request:
    paths:
      - "scripts/iq_telemetry.py"
      - "scripts/baseten_iq_preflight.py"
      - "scripts/requirements_iq_telemetry.txt"
      - "tests/test_baseten_iq_telemetry.py"
      - ".github/workflows/iq-baseten-otel-preflight.yml"
permissions:
  contents: read
jobs:
  telemetry-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only dependencies
        run: python -m pip install -r scripts/requirements_iq_telemetry.txt
      - name: Compile telemetry and preflight
        run: python -m compileall -q scripts/iq_telemetry.py scripts/baseten_iq_preflight.py tests/test_baseten_iq_telemetry.py
      - name: Test privacy, provenance, safetensors and OTLP guards
        run: python -m unittest discover -s tests -p 'test_baseten_iq_telemetry.py' -v

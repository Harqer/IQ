repos:
  - repo: local
    hooks:
      - id: behavioral-guidelines-check
        name: Behavioral Guidelines Check
        entry: .windsurf/scripts/guidelines-check.sh
        language: script
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=100']
      - id: check-merge-conflict
      - id: trailing-whitespace

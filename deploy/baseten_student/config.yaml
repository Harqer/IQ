# Architecture-only Baseten probe. DO NOT PUSH without explicit cost approval.
model_name: iq-glm53-architecture-probe
model_class_name: Model
base_image:
  image: pytorch/pytorch:2.10.0-cuda12.8-cudnn9-devel
external_package_dirs:
  - ../../iq_cloud
  - ../../iq_model
  - ../../iq_transfer
  - ../../scripts
python_version: py311
system_packages:
  - git
requirements:
  - transformers==5.17.0
  - huggingface_hub>=0.35
  - safetensors>=0.4.5
  - numpy>=1.26
  - einops
  - ninja
  - packaging
  - tilelang==0.1.8
  - apache-tvm-ffi==0.1.9
  - quack-kernels
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-exporter-otlp-proto-http
build_commands:
  - git clone https://github.com/state-spaces/mamba.git /tmp/iq-mamba-pinned
  - git -C /tmp/iq-mamba-pinned checkout e9594ce1c732d97440f0332fdc43170a2294dbfa
  - |
    python - <<'PY'
    from pathlib import Path
    p = Path('/tmp/iq-mamba-pinned/mamba_ssm/ops/tilelang/mamba3/mamba3_mimo_fwd.py')
    s = p.read_text()
    old = '                for cs, p in T.Parallel(chunk_size, P):\n                    v_shared[cs, p] = V[i_b, chunk_start+cs, i_h, p]'
    new = '                for cs, p in T.Parallel(chunk_size, P):\n                    if chunk_start + cs < S:\n                        v_shared[cs, p] = V[i_b, chunk_start+cs, i_h, p]\n                    else:\n                        v_shared[cs, p] = 0.0'
    assert s.count(old) == 1, 'unrecognized pinned MIMO kernel; abort'
    p.write_text(s.replace(old, new))
    PY
  - TORCH_CUDA_ARCH_LIST=9.0 MAMBA_FORCE_BUILD=TRUE python -m pip install --no-build-isolation --no-deps /tmp/iq-mamba-pinned
resources:
  accelerator: H100
  cpu: "8"
  memory: 32Gi
runtime:
  predict_concurrency: 1
environment_variables:
  IQ_PHASE: architecture_only
secrets:
  - hf_access_token
model_metadata:
  example_model_input:
    prompt: "The next integer after 1 2 3 is"
    max_new_tokens: 4

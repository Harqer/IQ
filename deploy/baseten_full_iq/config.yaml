# FULL 235-LAYER IQ (NOT the 24-layer student)
# DO NOT PUSH AS A PAID DEPLOYMENT UNTIL CPU VALIDATION + COST APPROVAL.
model_name: iq235-glm53-architecture-only
model_class_name: Model
base_image:
  image: pytorch/pytorch:2.10.0-cuda12.8-cudnn9-devel
# One staged parent preserves package names under packages/.
# The stage contains only the required, reviewed source files.
external_package_dirs:
  - ../_iq235_baseten_packages
system_packages:
  - git
requirements:
  - transformers==5.17.0
  - huggingface_hub>=0.35
  - safetensors>=0.4.5
  - numpy>=1.26
  - einops
  - ninja
  - packaging
  - tilelang==0.1.8
  - apache-tvm-ffi==0.1.9
  - quack-kernels
  - opentelemetry-api
  - opentelemetry-sdk
  - opentelemetry-exporter-otlp-proto-http
build_commands:
  # Install via pinned VCS URL. pip's direct_url.json must contain vcs_info
  # because require_mamba3_mimo_runtime() checks the exact source commit.
  - TORCH_CUDA_ARCH_LIST=9.0 MAMBA_FORCE_BUILD=TRUE python -m pip install --no-build-isolation --no-deps 'git+https://github.com/state-spaces/mamba.git@e9594ce1c732d97440f0332fdc43170a2294dbfa'
  # Patch the installed TileLang Python kernel, not a detached source clone.
  - python3 -c 'from pathlib import Path; from importlib.util import find_spec; import sys; spec=find_spec("mamba_ssm"); spec and spec.submodule_search_locations or sys.exit("no pinned mamba_ssm install"); root=Path(next(iter(spec.submodule_search_locations))); p=root/"ops/tilelang/mamba3/mamba3_mimo_fwd.py"; s=p.read_text(encoding="utf-8"); old="                for cs, p in T.Parallel(chunk_size, P):\n                    v_shared[cs, p] = V[i_b, chunk_start+cs, i_h, p]"; new="                for cs, p in T.Parallel(chunk_size, P):\n                    if chunk_start + cs < S:\n                        v_shared[cs, p] = V[i_b, chunk_start+cs, i_h, p]\n                    else:\n                        v_shared[cs, p] = 0.0"; s.count(old)==1 or sys.exit("unrecognized pinned MIMO source; fail closed"); p.write_text(s.replace(old, new), encoding="utf-8")'
  - python3 -c 'from importlib.metadata import distribution; from pathlib import Path; from importlib.util import find_spec; import json; from hashlib import sha256; d=distribution("mamba_ssm"); info=json.loads(d.read_text("direct_url.json")); assert info.get("vcs_info",{}).get("commit_id")=="e9594ce1c732d97440f0332fdc43170a2294dbfa", "Mamba3 install lost pinned VCS provenance"; p=Path(next(iter(find_spec("mamba_ssm").submodule_search_locations)))/"ops/tilelang/mamba3/mamba3_mimo_fwd.py"; s=p.read_text(); assert "if chunk_start + cs < S:" in s, "missing patched MIMO tail guard"'
resources:
  accelerator: H200:8
  cpu: "32"
  memory: 256Gi
secrets:
  - hf_access_token
environment_variables:
  IQ_PHASE: architecture_only
runtime:
  predict_concurrency: 1
  enable_tracing_data: true
model_metadata:
  example_model_input:
    prompt: "1 2 3"
    max_new_tokens: 1
